[workspace]
resolver = "2"
members = [
    "crates/hex-fixture",
    "crates/ptp-proto",
    "crates/usb-freebsd",
    "crates/mtp-session",
    "crates/mtpprobe",
    "crates/mtpfs",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.82"
license = "BSD-2-Clause"
repository = "https://github.com/laidback01/bsdroid"

[profile.release]
overflow-checks = true
