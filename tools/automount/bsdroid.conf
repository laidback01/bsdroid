# Mounts a cellphone when a person connects the cellphone.
#
# Install:
#   doas cp tools/automount/bsdroid.conf /usr/local/etc/devd/
#   doas cp tools/automount/bsdroid-automount /usr/local/sbin/
#   doas service devd restart
#
# The rule matches the vendor alone, and not the product. An Android cellphone
# gives a different product for each USB mode, so a person who selects file
# transfer mode makes a new ATTACH event with a new product. The helper then
# looks for MTP, and stops without a message if the cellphone gives no MTP.
#
# Run `mtpfs -l` for the vendor of your cellphone. 0x04e8 is Samsung.
# Add one pair of rules for each vendor you want.

notify 100 {
	match "system"		"USB";
	match "subsystem"	"DEVICE";
	match "type"		"ATTACH";
	match "vendor"		"0x04e8";
	action "/usr/local/sbin/bsdroid-automount attach $cdev $vendor $product $sernum";
};

notify 100 {
	match "system"		"USB";
	match "subsystem"	"DEVICE";
	match "type"		"DETACH";
	match "vendor"		"0x04e8";
	action "/usr/local/sbin/bsdroid-automount detach $cdev $vendor $product $sernum";
};
