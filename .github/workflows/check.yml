name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # usb-freebsd links libusb20 and mtpfs links the FUSE library of FreeBSD.
  # Neither library is on a Linux runner, so neither program links there.
  #
  # Linking is the only step that needs them. `cargo check` and `cargo clippy`
  # stop before the linker, so this job covers every crate and answers in
  # seconds. An earlier version of this file checked ptp-proto alone, and a
  # lint fault in the other four waited for the FreeBSD machine.
  portable:
    name: check and lint every crate, on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # These three crates need no library from FreeBSD, so they also run.
      - run: cargo test -p ptp-proto -p mtp-session -p hex-fixture

  # The manifest declares a lowest version of Rust. Nothing checked it, so a
  # feature from a later version could reach the code and no job would notice.
  msrv:
    name: the lowest version of Rust the manifest allows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82.0
      - run: cargo check --workspace --all-targets

  freebsd:
    name: the whole project, on FreeBSD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test in a FreeBSD machine
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y rust fusefs-libs3 pkgconf
          run: |
            cargo fmt --all --check
            cargo clippy --all --all-targets -- -D warnings
            cargo test --all

  docs:
    name: Simplified Technical English
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The linter comes from the SimpleEnglish project, under the MIT licence.
      # This repository does not copy the linter.
      - name: Get the linter
        run: git clone --depth 1 https://github.com/AminBlg/SimpleEnglish.git /tmp/SimpleEnglish

      - name: Check the documentation
        env:
          STE_LINT: /tmp/SimpleEnglish/evals/ste_lint.py
        run: sh tools/lint-docs.sh
