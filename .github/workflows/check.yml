name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Only ptp-proto builds on Linux. usb-freebsd links libusb20, and mtpfs links
  # the FUSE library of FreeBSD. Neither library is on a Linux runner, so an
  # earlier version of this file failed on each push.
  portable:
    name: the protocol crate, on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy -p ptp-proto --all-targets -- -D warnings
      - run: cargo test -p ptp-proto

  freebsd:
    name: the whole project, on FreeBSD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test in a FreeBSD machine
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y rust fusefs-libs3 pkgconf
          run: |
            cargo fmt --all --check
            cargo clippy --all --all-targets -- -D warnings
            cargo test --all

  docs:
    name: Simplified Technical English
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The linter comes from the SimpleEnglish project, under the MIT licence.
      # This repository does not copy the linter.
      - name: Get the linter
        run: git clone --depth 1 https://github.com/AminBlg/SimpleEnglish.git /tmp/SimpleEnglish

      - name: Check the documentation
        env:
          STE_LINT: /tmp/SimpleEnglish/evals/ste_lint.py
        run: sh tools/lint-docs.sh
